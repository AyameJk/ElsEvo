name: Compilar e Publicar Instalador

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_FILE: 'ElsEvo.csproj'
  ISS_FILE: 'ElsEvo.iss'
  CAMINHO_INSTALADOR: ''

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Desativar conversão CRLF do Git (evita heredoc bash quebrado no Windows)
        run: git config --global core.autocrlf false
        shell: bash

      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determinar versão
        id: versao
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            $versao = $tag -replace '^v', ''
          } else {
            $versao = "0.0.0-dev"
          }
          Write-Host "Versão resolvida: $versao"
          echo "versao=$versao" >> $env:GITHUB_OUTPUT

      - name: Sincronizar versão em AppVersion.cs
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $versao = "${{ steps.versao.outputs.versao }}"
          $caminho = "AppVersion.cs"
          $conteudo = Get-Content $caminho -Raw
          $conteudo = $conteudo -replace 'VersaoParaAtualizacao = "[^"]+"', "VersaoParaAtualizacao = `"$versao`""
          Set-Content -Path $caminho -Value $conteudo -NoNewline
          Write-Host "AppVersion.cs updated to $versao"

      - name: Restaurar dependências
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Publicar (self-contained, single-file)
        run: >
          dotnet publish ${{ env.PROJECT_FILE }}
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.versao.outputs.versao }}

      - name: Verificar se o executável foi gerado
        shell: pwsh
        run: |
          $caminho = "bin\Release\net8.0-windows\win-x64\ElsEvo.exe"
          if (-not (Test-Path $caminho)) {
            Write-Error "ElsEvo.exe não foi encontrado em $caminho -- publish falhou silenciosamente."
            exit 1
          }
          Write-Host "Executável encontrado: $caminho"

      - name: Instalar Inno Setup
        if: github.event_name == 'release'
        run: choco install innosetup -y

      - name: Baixar tradução não-oficial do Inno Setup (Japonês)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $pastaIdiomas = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Japanese.isl"
          $destino = Join-Path $pastaIdiomas "Japanese.isl"
          Invoke-WebRequest -Uri $url -OutFile $destino
          Write-Host "Baixado: Japanese.isl"

      - name: Compilar instalador com Inno Setup
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $issc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $issc "${{ env.ISS_FILE }}" "/DMyAppVersion=${{ steps.versao.outputs.versao }}"

      - name: Verificar se o instalador foi gerado
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $caminho = "Output\ElsEvo-Setup.exe"
          if (-not (Test-Path $caminho)) {
            Write-Error "ElsEvo-Setup.exe não foi encontrado em $caminho -- confira o OutputDir no .iss."
            exit 1
          }
          Write-Host "Instalador encontrado: $caminho"
          "CAMINHO_INSTALADOR=$caminho" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Salvar artefato de build (push/manual)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: elsevo-build-${{ github.sha }}
          path: bin/Release/net8.0-windows/win-x64/
          retention-days: 7

      - name: Anexar instalador na Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CAMINHO_INSTALADOR }}
          tag_name: ${{ github.event.release.tag_name }}

      - name: Atualizar version.json com os dados da Release
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: python3 scripts/atualizar_version_json.py

      - name: Commit e push do version.json
        if: github.event_name == 'release'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || (git commit -m "Atualiza version.json (${{ github.event.release.tag_name }})" && git push origin HEAD:main)
